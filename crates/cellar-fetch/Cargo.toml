[package]
name = "cellar-fetch"
description = "Downloads and unpacks Meta btarchive source bundles for the cellar archive."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["whatsapp", "btarchive", "bundle", "download", "zip"]
categories = ["development-tools", "web-programming::http-client"]

[lib]
doctest = false

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
cellar-core = { workspace = true }
hex = { version = "0.4", default-features = false, features = ["std"] }
regex = { workspace = true }
sha2 = { version = "0.11", default-features = false }
# rustls, not native-tls: keeps the crate C-free and cross-compilable, matching the
# rest of the workspace's TLS choice.
ureq = { version = "3.1", default-features = false, features = ["rustls", "gzip"] }
# flate2's default backend is miniz_oxide (pure Rust), so DEFLATE stays C-free.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
