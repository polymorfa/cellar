[package]
name = "cellar"
description = "CLI and MCP server for browsing, diffing and graphing Meta source-bundle archives."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["whatsapp", "mcp", "reverse-engineering", "diff", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "cellar"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
cellar-core = { workspace = true }
cellar-fetch = { workspace = true }
cellar-index = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context", "wrap_help"] }
regex = { workspace = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true }
